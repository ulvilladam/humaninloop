[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ulvilladam-humaninloop"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告人类介入点的选择相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ulvilladam" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ulvilladam.github.io"
Repository = "https://github.com/ulvilladam/humaninloop"
Issues = "https://github.com/ulvilladam/humaninloop/issues"

[project.scripts]
humaninloop = "humaninloop:main"

[tool.setuptools]
py-modules = ["humaninloop"]
